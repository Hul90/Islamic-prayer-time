<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
body{margin:0;padding:20px 16px 40px;background:#07120d;color:#f4d35e;font-family:sans-serif;line-height:1.75}h1{font-size:24px;line-height:1.4;margin:0 0 14px;color:#f6d365}p{font-size:17px;color:#f4d35e;margin:12px 0}.arabic{background:#10271c;border-radius:14px;padding:14px;margin:12px 0;color:#fff0a6;font-size:22px;line-height:2.0;text-align:right}.pron{background:#112a1e;border-left:4px solid #f4d35e;border-radius:10px;padding:12px;margin:10px 0;color:#ffe89a;font-size:16px}.meaning{background:#132d21;border-radius:12px;padding:13px;margin:10px 0;color:#ffeaa0;font-size:16px}.page{font-size:13px;color:#d8bf63;margin-bottom:14px}hr{border:0;border-top:1px solid #294436;margin:18px 0}</style></head><body><h1>মাশ&#x27;আরে হারামের নিকট যিকির</h1><div class="page">(বইয়ের পৃষ্ঠা: 95)</div><p>জাবির (রাঃ) বলেন, রাসুল (ছাঃ) মাশ&#x27;আরে হারামের নিকট পৌঁছে কিবলামুখী হ&#x27;লেন তারপর প্রার্থনা করলেন। তিনি আল্লাহু আকবার বললেন, লা ইলা-হা ইল্লাল্লা-হ ও আলহামদুলিল্লা-হ বললেন। উল্লেখ্য যে, (মুসলিম, মিশকাত হা/২৫৫৫) এসব যিকিরের কোন সংখ্যা উল্লেখ নেই।</p></body></html>

name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      # This project's zip did not include gradlew / gradlew.bat / gradle-wrapper.jar,
      # only gradle-wrapper.properties. The step above installs Gradle 9.3.1 directly
      # so the build works without the wrapper. If you add the wrapper files back to
      # the repo later, you can switch these `gradle` calls to `./gradlew` instead.

      - name: Create empty .env (no Gemini key needed for a normal build)
        run: touch .env

      - name: Generate debug keystore
        run: |
          keytool -genkey -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: islamic-prayer-time-debug-apk
          path: app/build/outputs/apk/debug/*.apk

  # --- OPTIONAL: build a signed release APK ---
